<!--
  Página pública de facturas de cadetes (2026-11-19). Ver ESTADO-FACTURAS-LINK.md.
  El cadete la abre desde su link fijo (/factura.html?t=<token>). No usa sesión:
  solo llama a factura_link_info / factura_link_registrar / factura_link_borrar (validan el token)
  y SUBE el archivo al bucket privado 'facturas' dentro de link/<token>/ (no puede leer nada).
-->
<style>
:root{
  --bg:#0F0F1B; --card:rgba(27,28,46,.72); --text:#F2F3F7; --muted:#A3A6BA; --faint:#8E91A6;
  --teal:#2EE6B0; --teal-ink:#0B1F19; --line:rgba(255,255,255,.14); --line-soft:rgba(255,255,255,.06);
  --amber:#FFB84D;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:
    radial-gradient(120% 60% at 0% 0%, rgba(0,255,180,.06), transparent 60%),
    radial-gradient(100% 50% at 100% 100%, rgba(0,180,255,.05), transparent 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text); font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
.page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:22px clamp(22px,4vw,48px);border-bottom:1px solid transparent}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:10px;background:rgba(46,230,176,.12);border:1px solid rgba(46,230,176,.28);display:flex;align-items:center;justify-content:center}
.word{font-family:'Sora',sans-serif;font-weight:700;font-size:19px;letter-spacing:-.02em}
.top small{font-size:13px;color:var(--muted)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 22px 32px}
.card{width:100%;max-width:440px}
.foot{padding:0 22px 28px;text-align:center;font-size:13px;color:var(--faint);line-height:1.5}
.chip{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);background:rgba(46,230,176,.10);border:1px solid rgba(46,230,176,.22);padding:6px 10px;border-radius:999px}
.hola{font-size:17px;color:var(--muted);margin-top:14px}
h1{font-family:'Sora',sans-serif;font-weight:700;letter-spacing:-.03em;line-height:1.08;font-size:38px;margin-top:10px}
h1.sm{font-size:32px;line-height:1.1;margin-top:0}
.sub{font-size:15px;line-height:1.5;color:var(--muted);margin-top:12px}
.acciones{display:flex;flex-direction:column;gap:12px;margin-top:30px}
.btn{height:64px;border-radius:18px;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:transform .1s, opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:default}
.btn-si{border:none;background:var(--teal);color:var(--teal-ink);font-weight:600;box-shadow:0 0 35px rgba(0,255,180,.18)}
.btn-no{background:var(--card);border:1px solid var(--line);color:var(--text);font-weight:500}
.icono{width:72px;height:72px;border-radius:22px;display:flex;align-items:center;justify-content:center;margin-bottom:26px}
.icono.ok{background:rgba(46,230,176,.14);border:1px solid rgba(46,230,176,.35);box-shadow:0 0 35px rgba(0,255,180,.15)}
.icono.neutro{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.icono.alerta{background:rgba(255,184,77,.12);border:1px solid rgba(255,184,77,.35)}
.panel{margin-top:26px;padding:18px;border-radius:18px;background:var(--card);border:1px solid var(--line-soft)}
.panel span{font-size:14px;color:var(--muted)}
.bultos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.bulto{height:44px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.16)}
.bulto[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.link{background:none;border:none;padding:10px 0;margin-top:18px;color:var(--teal);font-size:15px;font-weight:500;cursor:pointer}
.estado-hoy{display:flex;flex-direction:column;gap:6px}
.estado-hoy b{font-size:17px;font-weight:600}
.alerta-txt{color:var(--amber)}
.err{margin-top:16px;font-size:14px;color:var(--amber);min-height:20px}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--teal);animation:g 0.8s linear infinite;margin:0 auto}
@keyframes g{to{transform:rotate(360deg)}}
.fade{animation:f .2s ease-out}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.fade{animation:none}.spinner{animation-duration:2s}}
@media (min-width:720px){
  .top{border-bottom-color:var(--line-soft)}
  main{padding:48px 16px}
  .card{max-width:520px;padding:44px;border-radius:28px;background:var(--card);border:1px solid var(--line-soft);box-shadow:0 20px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05)}
  h1{font-size:44px}
  .acciones{display:grid;grid-template-columns:1fr 1fr}
  .btn{height:60px;font-size:17px;border-radius:16px}
  .btn-no{background:transparent}
  .panel{background:rgba(15,15,27,.6)}
}
.monto{font-family:'Sora',sans-serif;font-weight:700;letter-spacing:-.03em;font-size:44px;line-height:1;margin-top:10px}
.lista{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.comp{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line-soft);font-size:15px}
.comp small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.quitar{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}
.aviso{margin-top:18px;padding:14px 16px;border-radius:14px;font-size:15px;line-height:1.45;background:rgba(255,184,77,.10);border:1px solid rgba(255,184,77,.30);color:var(--text)}
.aviso.ok{background:rgba(46,230,176,.10);border-color:rgba(46,230,176,.30)}
.form{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.form label{font-size:14px;color:var(--muted)}
.tipos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}
.tipo{height:44px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.16)}
.tipo[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.inp{height:52px;border-radius:14px;border:1px solid var(--line);background:rgba(15,15,27,.6);color:var(--text);font-size:18px;padding:0 14px;width:100%;font-family:inherit}
.sem{font-size:13px;color:var(--muted);margin-top:26px;text-transform:uppercase;letter-spacing:.08em}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="brand">
      <div class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2EE6B0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h12l-3-3"/><path d="M20 17H8l3 3"/></svg></div>
      <span class="word">flexit</span>
    </div>
    <small>Facturas</small>
  </header>
  <main><div class="card" id="app" aria-live="polite"><div class="spinner" role="status" aria-label="Cargando"></div></div></main>
  <p class="foot" id="foot">¿Algo no coincide? Escribile a Alejo por WhatsApp.</p>
</div>
<input type="file" id="archivo" accept="application/pdf,image/*">

<script>
(function () {
  var SUPABASE_URL = "https://svlagoosmxxcsbevkrhy.supabase.co";
  var KEY = "sb_publishable_yYrDNXJECjKQJaa7xx4dww_iwugKOnI";
  var token = new URLSearchParams(location.search).get("t") || "";
  var app = document.getElementById("app");
  var fileInput = document.getElementById("archivo");
  var info = null;
  var ocupado = false;
  var pendiente = null;   // archivo esperando que el cadete complete tipo/monto (foto o PDF ilegible)
  var semanaSubiendo = null;
  var mensaje = "";       // aviso después de subir

  var ICON = {
    check: '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2EE6B0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    reloj: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFB84D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    link: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFB84D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
    subir: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B1F19" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>',
    cash: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#F2F3F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>'
  };
  var TIPOS = { factura: "Factura", nd: "Nota de débito", nc: "Nota de crédito" };

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function money(n){ return "$" + Math.round(Number(n) || 0).toLocaleString("es-AR"); }
  function semanaTxt(lunes){
    var p = lunes.split("-").map(Number), d = new Date(p[0], p[1]-1, p[2]), s = new Date(p[0], p[1]-1, p[2]+5);
    function f(x){ return String(x.getDate()).padStart(2,"0") + "/" + String(x.getMonth()+1).padStart(2,"0"); }
    return f(d) + " al " + f(s);
  }

  function rpc(fn, body) {
    return fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  }

  // ── lectura del PDF (pdf.js a demanda, misma versión que la app) ──
  var pdfJs = null;
  function cargarPdfJs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    if (pdfJs) return pdfJs;
    pdfJs = new Promise(function (ok, mal) {
      var s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      s.onload = function () {
        if (!window.pdfjsLib) return mal(new Error("pdf.js"));
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        ok(window.pdfjsLib);
      };
      s.onerror = function () { pdfJs = null; mal(new Error("pdf.js")); };
      document.head.appendChild(s);
    });
    return pdfJs;
  }
  function numeroAR(s) {
    var t = String(s).replace(/\s/g, "");
    if (/,\d{1,2}$/.test(t)) t = t.replace(/\./g, "").replace(",", ".");
    else if (/\.\d{3}(\.|$)/.test(t)) t = t.replace(/\./g, "");
    var n = parseFloat(t);
    return isFinite(n) && n > 0 ? n : null;
  }
  // Exportada para los tests (window.__leer)
  function leerTexto(texto) {
    var t = String(texto || "").replace(/\s+/g, " ");
    var tipo = null;
    if (/NOTA\s+DE\s+D[ÉE]BITO/i.test(t)) tipo = "nd";
    else if (/NOTA\s+DE\s+CR[ÉE]DITO/i.test(t)) tipo = "nc";
    else if (/FACTURA/i.test(t)) tipo = "factura";
    var monto = null, m;
    var reTot = /Importe\s+Total\s*:?\s*\$?\s*([\d.]+(?:,\d{1,2})?)/ig, ult = null;
    while ((m = reTot.exec(t))) ult = m[1];
    if (!ult) { var reT2 = /\bTotal\s*:?\s*\$\s*([\d.]+(?:,\d{1,2})?)/ig; while ((m = reT2.exec(t))) ult = m[1]; }
    if (ult) monto = numeroAR(ult);
    var nro = null;
    var pats = [/Comp\.?\s*N[roº°.]*\s*[:.]?\s*(\d{4,13})/i, /N[uú]mero\s*[:.]?\s*(?:\d{1,5}\s*-\s*)?(\d{4,13})/i,
                /N[roº°]+\s*[:.]?\s*(?:\d{1,5}\s*-\s*)?(\d{4,13})/i, /\b\d{1,5}\s*-\s*(\d{8})\b(?!\s*-)/];
    for (var i = 0; i < pats.length && !nro; i++) { m = t.match(pats[i]); if (m && m[1].replace(/\D/g, "").length >= 4) nro = m[1].replace(/\D/g, "").slice(-4); }
    var cuit = null; m = t.match(/\b(20|23|24|27|30|33|34)-?(\d{8})-?(\d)\b/);
    if (m) cuit = m[1] + m[2] + m[3];
    return { tipo: tipo, monto: monto, nro: nro, cuit: cuit };
  }
  window.__leer = leerTexto;
  function leerPdf(file) {
    return cargarPdfJs().then(function (pdfjs) {
      return file.arrayBuffer().then(function (data) { return pdfjs.getDocument({ data: data }).promise; });
    }).then(function (doc) {
      return doc.getPage(1).then(function (p) { return p.getTextContent(); });
    }).then(function (tc) {
      return leerTexto(tc.items.map(function (i) { return i.str; }).join(" "));
    }).catch(function () { return { tipo: null, monto: null, nro: null, cuit: null }; });
  }

  function cargar() {
    if (!token) { info = { ok: false }; return render(); }
    rpc("factura_link_info", { p_token: token })
      .then(function (j) { info = j; render(); })
      .catch(function () { renderError("No pudimos cargar la página. Revisá tu conexión e intentá de nuevo."); });
  }

  function elegirArchivo(semana) { semanaSubiendo = semana; mensaje = ""; fileInput.value = ""; fileInput.click(); }

  fileInput.addEventListener("change", function () {
    var file = fileInput.files && fileInput.files[0];
    if (!file) return;
    if (file.size > 15 * 1024 * 1024) { mensaje = "El archivo es muy pesado (máximo 15 MB)."; return render(); }
    var esPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
    if (!esPdf && !/^image\//.test(file.type)) { mensaje = "Tiene que ser un PDF o una foto."; return render(); }
    ocupado = true; render();
    (esPdf ? leerPdf(file) : Promise.resolve({ tipo: null, monto: null, nro: null, cuit: null })).then(function (leido) {
      ocupado = false;
      if (esPdf && leido.monto && leido.tipo) return subir(file, leido.tipo, leido.monto, "pdf", leido);
      // foto o PDF que no se pudo leer: que el cadete diga qué es y el importe
      pendiente = { file: file, esPdf: esPdf, tipo: leido.tipo || sugerirTipo(), monto: leido.monto, leido: leido };
      render();
    });
  });

  function semanaDe(lunes) { return (info.semanas || []).filter(function (s) { return s.semana === lunes; })[0]; }
  function diferencia(s) { return s && s.neto != null && s.monto != null ? Math.round(s.monto - s.neto) : null; }
  function sugerirTipo() {
    var s = semanaDe(semanaSubiendo), d = diferencia(s);
    if (!s || !s.comprobantes.length || d == null) return "factura";
    return d > 0 ? "nd" : d < 0 ? "nc" : "factura";
  }

  function subir(file, tipo, monto, origen, leido) {
    ocupado = true; pendiente = null; render();
    var esPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
    var ext = esPdf ? "pdf" : ((file.type.split("/")[1] || "jpg").replace("jpeg", "jpg").replace(/[^a-z0-9]/g, "") || "jpg");
    var nombre = Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + "." + ext;
    var path = "link/" + token + "/" + semanaSubiendo + "/" + nombre;
    fetch(SUPABASE_URL + "/storage/v1/object/facturas/" + path, {
      method: "POST",
      headers: { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": file.type || (esPdf ? "application/pdf" : "image/jpeg") },
      body: file
    }).then(function (r) {
      if (!r.ok) throw new Error("subida " + r.status);
      return rpc("factura_link_registrar", { p_token: token, p_semana: semanaSubiendo, p_archivo: path, p_tipo: tipo,
        p_nro: leido && leido.nro, p_monto: monto, p_monto_origen: origen, p_cuit: leido && leido.cuit });
    }).then(function (j) {
      ocupado = false;
      if (!j.ok) { mensaje = MOTIVOS[j.motivo] || "No se pudo registrar. Probá de nuevo."; cargar(); return; }
      info = j.info; mensaje = ""; render();
    }).catch(function () {
      ocupado = false; mensaje = "No se pudo subir. Revisá la conexión y probá de nuevo."; render();
    });
  }
  var MOTIVOS = {
    no_confirmada: "Tu liquidación todavía está en revisión. Esperá a que te confirmemos el monto.",
    pagada: "Esa semana ya está pagada.", efectivo: "Esa semana cobrás en efectivo: no hace falta factura.",
    demasiados: "Subiste muchos archivos hoy. Escribile a Alejo.", link_invalido: "Este link ya no funciona."
  };

  function quitar(id) {
    if (!window.confirm("¿Sacar este comprobante?")) return;
    ocupado = true; render();
    rpc("factura_link_borrar", { p_token: token, p_id: id }).then(function (j) {
      ocupado = false; if (j.ok) info = j.info; render();
    }).catch(function () { ocupado = false; mensaje = "No se pudo sacar. Probá de nuevo."; render(); });
  }

  function listaComprobantes(s, editable) {
    if (!s.comprobantes.length) return "";
    return '<div class="lista">' + s.comprobantes.map(function (c) {
      var det = (c.nro ? "Nº …" + esc(c.nro) + " · " : "") + (c.monto != null ? money(c.monto) : "sin importe");
      return '<div class="comp"><div>' + esc(TIPOS[c.tipo]) + '<small>' + det + '</small></div>' +
        (editable ? '<button class="quitar" data-quitar="' + c.id + '">Sacar</button>' : "") + '</div>';
    }).join("") + '</div>';
  }

  function bloqueSemana(s) {
    var h = '<p class="sem">Semana del ' + semanaTxt(s.semana) + '</p>';
    if (s.estado === "revision") {
      return h + '<h1 class="sm" style="margin-top:8px">Tu liquidación está en revisión</h1>' +
        '<p class="sub">Cuando te confirmemos el monto, lo vas a ver acá y vas a poder subir la factura.</p>' +
        '<button class="link" data-recargar="1">Actualizar</button>';
    }
    if (s.estado === "pagado") {
      return h + '<p class="monto">' + money(s.monto) + '</p><div class="aviso ok">✓ Pagado. ¡Gracias!</div>';
    }
    if (s.estado === "efectivo") {
      return h + '<p class="sub">Esta semana cobrás en efectivo: no hace falta factura.</p>';
    }
    if (s.estado === "lista") {
      return h + '<p class="monto">' + money(s.monto) + '</p>' +
        '<div class="aviso ok">✓ Recibimos tu factura. Ya está para pagar.</div>' + listaComprobantes(s, true);
    }
    // subir
    var d = diferencia(s), dudoso = s.comprobantes.some(function (c) { return c.origen === "manual" || c.obs; });
    var aviso = "";
    if (s.comprobantes.length && dudoso && d === 0) aviso = '<div class="aviso">Recibimos tu comprobante. Como es una foto o el CUIT no coincide, lo revisamos y te avisamos.</div>';
    else if (s.comprobantes.length && d != null && d > 0) aviso = '<div class="aviso">Facturaste ' + money(s.neto) + ' y tu liquidación es ' + money(s.monto) + '. Te falta una <b>nota de débito por ' + money(d) + '</b>.</div>';
    else if (s.comprobantes.length && d != null && d < 0) aviso = '<div class="aviso">Facturaste ' + money(s.neto) + ' y tu liquidación es ' + money(s.monto) + '. Hacé una <b>nota de crédito por ' + money(-d) + '</b>.</div>';
    else if (s.comprobantes.length) aviso = '<div class="aviso">Recibimos el archivo pero no pudimos leer el importe. Lo revisamos y te avisamos.</div>';
    var txtBoton = !s.comprobantes.length ? "Subir factura" : d > 0 ? "Subir nota de débito" : d < 0 ? "Subir nota de crédito" : "Subir otro comprobante";
    return h + '<p class="hola" style="margin-top:6px">Tu monto es</p><p class="monto">' + money(s.monto) + '</p>' +
      (!s.comprobantes.length ? '<p class="sub">Hacé la factura por este importe y subila acá (PDF o foto).</p>' : "") +
      aviso + listaComprobantes(s, true) +
      '<div class="acciones" style="grid-template-columns:1fr"><button class="btn btn-si" data-subir="' + s.semana + '">' + ICON.subir + txtBoton + '</button></div>';
  }

  function formPendiente() {
    var p = pendiente, s = semanaDe(semanaSubiendo);
    return '<p class="sem">Semana del ' + semanaTxt(semanaSubiendo) + '</p>' +
      '<h1 class="sm" style="margin-top:8px">' + (p.esPdf ? "No pudimos leer el PDF" : "Contanos qué subiste") + '</h1>' +
      '<p class="sub">' + esc(p.file.name) + '</p>' +
      '<div class="form"><div><label>¿Qué es?</label><div class="tipos">' +
        Object.keys(TIPOS).map(function (k) { return '<button class="tipo" data-tipo="' + k + '" aria-pressed="' + (p.tipo === k) + '">' + TIPOS[k] + '</button>'; }).join("") +
      '</div></div><div><label for="monto">Importe total del comprobante</label>' +
      '<input class="inp" id="monto" inputmode="decimal" placeholder="' + (s && s.monto ? money(s.monto) : "$") + '" value="' + (p.monto ? Math.round(p.monto) : "") + '"></div></div>' +
      '<div class="acciones"><button class="btn btn-si" data-confirmar="1">' + ICON.subir + 'Subir</button>' +
      '<button class="btn btn-no" data-cancelar="1">Cancelar</button></div>';
  }

  function render() {
    var h = "";
    if (!info || !info.ok) {
      h = '<div class="icono alerta">' + ICON.link + '</div><h1 class="sm">Este link no funciona</h1>' +
        '<p class="sub">Puede que esté incompleto o que ya no sea válido. Escribile a Alejo y te pasa el nuevo.</p>';
    } else if (ocupado) {
      h = '<div class="spinner" role="status" aria-label="Subiendo"></div><p class="sub" style="text-align:center">Un segundo…</p>';
    } else if (pendiente) {
      h = formPendiente();
    } else if (!info.factura) {
      h = '<p class="hola">Hola, ' + esc(info.nombre) + '</p><div class="icono neutro" style="margin-top:18px">' + ICON.cash + '</div>' +
        '<h1 class="sm">Cobrás en efectivo</h1><p class="sub">No hace falta que mandes factura.</p>';
    } else {
      h = '<p class="hola">Hola, ' + esc(info.nombre) + '</p>' + (info.semanas || []).map(bloqueSemana).join("");
    }
    if (mensaje) h += '<p class="err">' + esc(mensaje) + '</p>';
    app.innerHTML = '<div class="fade">' + h + '</div>';
    bind("[data-subir]", function (b) { elegirArchivo(b.getAttribute("data-subir")); });
    bind("[data-quitar]", function (b) { quitar(Number(b.getAttribute("data-quitar"))); });
    bind("[data-recargar]", function () { app.innerHTML = '<div class="spinner"></div>'; cargar(); });
    bind("[data-tipo]", function (b) { pendiente.tipo = b.getAttribute("data-tipo"); var v = document.getElementById("monto").value; pendiente.monto = numeroAR(v); render(); });
    bind("[data-cancelar]", function () { pendiente = null; render(); });
    bind("[data-confirmar]", function () {
      var monto = numeroAR(document.getElementById("monto").value);
      if (!monto) { mensaje = "Escribí el importe total del comprobante."; return render(); }
      mensaje = "";
      subir(pendiente.file, pendiente.tipo, monto, "manual", pendiente.leido);
    });
  }
  function bind(sel, fn) { Array.prototype.forEach.call(app.querySelectorAll(sel), function (b) { b.addEventListener("click", function () { fn(b); }); }); }

  function renderError(msg) {
    app.innerHTML = '<div class="fade"><div class="icono alerta">' + ICON.reloj + '</div>' +
      '<h1 class="sm">Algo falló</h1><p class="sub">' + esc(msg) + '</p><button class="link" id="reintentar">Reintentar</button></div>';
    document.getElementById("reintentar").addEventListener("click", function () { app.innerHTML = '<div class="spinner"></div>'; cargar(); });
  }

  cargar();
})();
</script>
</body>
</html>
