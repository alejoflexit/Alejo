name: Flexit Carga Diaria v2

on:
  schedule:
    # GitHub documenta que el minuto 0 concentra carga y puede demorar o descartar jobs.
    # El VPS hace el intento principal a la 01:17 AR; estos dos son respaldos.
    - cron: '37 5 * * *'  # 2:37am AR — backup
    - cron: '53 6 * * *'  # 3:53am AR — backup adicional
  workflow_dispatch:
    # Dejando las dos fechas vacías corre la carga diaria de siempre.
    # Completándolas, corre SOLO el backfill del histograma por hora (columna `horas`):
    # no borra ni pisa nada más, se puede repetir sin riesgo.
    inputs:
      backfill_desde:
        description: 'Backfill horas — desde (YYYY-MM-DD, vacío = carga diaria normal)'
        required: false
        default: ''
      backfill_hasta:
        description: 'Backfill horas — hasta (YYYY-MM-DD)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: flexit-carga-diaria
  cancel-in-progress: false

jobs:
  carga:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Verificar Node
        run: node --version
          
      - name: Instalar dependencias
        run: cd automation && npm install --no-audit --no-fund

      - name: Crear carpeta temporal
        run: mkdir -p /tmp/lightdata

      - name: Ejecutar descarga
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BACKFILL_DESDE: ${{ inputs.backfill_desde }}
          BACKFILL_HASTA: ${{ inputs.backfill_hasta }}
          RUN_SOURCE: ${{ github.event_name }}
        run: cd automation && node descargar_lightdata.js
        timeout-minutes: 45
