name: Flexit Carga Diaria v2

on:
  schedule:
    - cron: '0 4 * * *'   # 1am AR — todos los días (incluye domingo→sábado)
    - cron: '0 5 * * *'   # 2am AR — backup
    - cron: '0 6 * * *'   # 3am AR — backup adicional
  workflow_dispatch:
    # Dejando las dos fechas vacías corre la carga diaria de siempre.
    # Completándolas, corre SOLO el backfill del histograma por hora (columna `horas`):
    # no borra ni pisa nada más, se puede repetir sin riesgo.
    inputs:
      backfill_desde:
        description: 'Backfill horas — desde (YYYY-MM-DD, vacío = carga diaria normal)'
        required: false
        default: ''
      backfill_hasta:
        description: 'Backfill horas — hasta (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  carga:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Verificar Node
        run: node --version
          
      - name: Instalar dependencias
        run: cd automation && rm -rf node_modules package-lock.json && npm install

      - name: Crear carpeta temporal
        run: mkdir -p /tmp/lightdata

      - name: Ejecutar descarga
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BACKFILL_DESDE: ${{ inputs.backfill_desde }}
          BACKFILL_HASTA: ${{ inputs.backfill_hasta }}
        run: cd automation && node descargar_lightdata.js
        timeout-minutes: 45
