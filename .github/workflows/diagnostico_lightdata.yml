name: Diagnostico temporal LightData

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd automation && npm install
      - name: Inspeccionar estructura sin datos sensibles
        env:
          LIGHTDATA_USER: ${{ secrets.LIGHTDATA_USER }}
          LIGHTDATA_PASSWORD: ${{ secrets.LIGHTDATA_PASSWORD }}
        run: cd automation && node diagnose_lightdata_receipt.js
