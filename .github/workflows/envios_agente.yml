name: Sync Envios Agente WhatsApp

# Sincroniza los envíos de los últimos días a la tabla `envios_busqueda`
# para que el agente de WhatsApp responda "¿dónde está mi pedido?".
# AISLADO de métricas: NO toca la tabla `semanas` ni la carga nocturna.

on:
  schedule:
    # Horarios en UTC; Buenos Aires es UTC-3. De 01 a 07 de la manana no corre:
    # nadie mira la pantalla y no hay movimiento que sincronizar.
    - cron: '0,30 10-14 * * *'      # 07:00 a 11:30 ART, cada media hora
    - cron: '0 15-23,0-3 * * *'     # 12:00 a 00:00 ART, cada hora
  workflow_dispatch:
    inputs:
      backfill_receipts:
        description: 'Completar DNI de recepciones ya confirmadas'
        required: false
        default: false
        type: boolean
      verify_receipt_id:
        description: 'Verificar que un envio tenga recepcion privada sin mostrar datos personales'
        required: false
        default: ''
        type: string
      inspect_detail_id:
        description: 'Diagnóstico seguro de claves de una ficha LightData'
        required: false
        default: ''
        type: string
      backfill_details:
        description: 'Completar origen exacto e historial de asignaciones'
        required: false
        default: false
        type: boolean
      historical_days:
        description: 'Días calendario a conservar en la caché histórica (default 14)'
        required: false
        default: '14'
        type: string
      sync_completo:
        description: 'Descarga completa (todos los estados, pesada). Solo para backfills.'
        required: false
        default: false
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: cd automation && npm install

      - name: Ejecutar sync de envios para el agente
        env:
          TZ: America/Argentina/Buenos_Aires
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LIGHTDATA_USER: ${{ secrets.LIGHTDATA_USER }}
          LIGHTDATA_PASSWORD: ${{ secrets.LIGHTDATA_PASSWORD }}
          BACKFILL_RECEIPTS: ${{ inputs.backfill_receipts || 'false' }}
          VERIFY_RECEIPT_ID: ${{ inputs.verify_receipt_id || '' }}
          INSPECT_DETAIL_ID: ${{ inputs.inspect_detail_id || '' }}
          BACKFILL_DETAILS: ${{ inputs.backfill_details || 'false' }}
          HISTORICAL_DAYS: ${{ inputs.historical_days || '14' }}
          SYNC_COMPLETO: ${{ inputs.sync_completo || 'false' }}
        run: cd automation && node sync_envios_agente.js
        timeout-minutes: 30
